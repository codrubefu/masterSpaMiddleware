version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    hostname: laravel-app
    ports:
      - "8082:80"
    volumes:
        - '.:/var/www/html'
    networks:
      laravel-net:
        aliases:
          - laravel-app

networks:
  laravel-net:
    driver: bridge
