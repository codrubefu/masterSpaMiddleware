version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    hostname: laravel-app
    ports:
      - "8082:80"
    volumes:
        - '.:/var/www/html'
    depends_on:
      - sqlserver
    networks:
      laravel-net:
        aliases:
          - laravel-app
    environment:
      - DB_CONNECTION=sqlsrv
      - DB_HOST=95.77.98.62
      - DB_PORT=8121
      - DB_DATABASE=spa
      - DB_USERNAME=sa
      - DB_PASSWORD=YourStrong!Passw0rd

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
    volumes:
     - /home/codrut/database:/var/opt/mssql/data

    networks:
      - laravel-net

networks:
  laravel-net:
    driver: bridge
